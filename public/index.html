<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globtel Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #0d0211;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- PRIHLASOVACIA OBRAZOVKA --- */
        #auth-interface {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .auth-container {
            background: #1a0826;
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, inset 0 0 10px #1a0826;
            padding: 30px;
            border-radius: 8px;
            width: 350px;
            text-align: center;
        }

        .auth-container h2 {
            color: #ff007f;
            text-shadow: 0 0 8px #ff007f;
            margin-bottom: 20px;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        .logo-globtel {
            color: #00ffcc;
            text-shadow: 0 0 8px #00ffcc;
            font-size: 2.2rem;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #00ffcc;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #0d0211;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 4px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            box-shadow: 0 0 8px #00ffcc;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #ff007f;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px #ff007f;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #e0006c;
            box-shadow: 0 0 15px #e0006c;
        }

        .btn-avatar {
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
            margin-top: 5px;
        }

        .btn-avatar:hover {
            background: #00ffcc;
            color: #0d0211;
            box-shadow: 0 0 12px #00ffcc;
        }

        .btn-logout {
            background: #ff0055;
            box-shadow: 0 0 10px #ff0055;
            margin-top: auto;
        }

        .btn-logout:hover {
            background: #cc0044;
            box-shadow: 0 0 15px #cc0044;
        }

        .btn-kick {
            background: #ff9900;
            color: black;
            font-weight: bold;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 8px #ff9900;
        }

        .btn-ban {
            background: #ff0000;
            color: white;
            font-weight: bold;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 8px #ff0000;
        }

        .auth-container p {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #888;
        }

        .auth-container a {
            color: #00ffcc;
            text-decoration: none;
        }

        .auth-container a:hover {
            text-decoration: underline;
        }

        /* --- CHATOVACIE ROZHRANIE (POKEC STYLE 3-STĹPCE) --- */
        #chat-interface {
            display: none;
            width: 98vw;
            height: 95vh;
            background: #14051f;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc;
            border-radius: 8px;
        }

        .chat-layout {
            display: flex;
            height: 100%;
            width: 100%;
        }

        /* 1. ĽAVÝ STĹPEC (Miestnosti) */
        .sidebar-left {
            width: 240px;
            background: #0d0211;
            border-right: 2px solid #00ffcc;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
        }

        .sidebar-left h3 {
            color: #ff007f;
            text-shadow: 0 0 5px #ff007f;
            font-size: 1.1rem;
            border-bottom: 1px dashed #ff007f;
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        /* 2. STREDNÝ STĹPEC (Hlavný chat) */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #14051f;
            min-width: 0;
        }

        .chat-header {
            padding: 15px;
            background: #0d0211;
            border-bottom: 2px solid #00ffcc;
            color: #ff007f;
            text-shadow: 0 0 5px #ff007f;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 3. PRAVÝ STĹPEC (Ľudia v miestnosti + Reklama na štýl Pokecu) */
        .sidebar-right {
            width: 260px;
            background: #0d0211;
            border-left: 2px solid #00ffcc;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-right-top {
            padding: 15px;
            border-bottom: 2px solid #00ffcc;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .sidebar-right-top h3 {
            color: #ff007f;
            text-shadow: 0 0 5px #ff007f;
            font-size: 1.1rem;
            border-bottom: 1px dashed #ff007f;
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        /* Pokec-like reklamný box dole v pravom stĺpci */
        .sidebar-right-banner {
            flex: 1;
            background: #1a0826;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-top: 1px dashed #333;
        }

        .sidebar-right-banner p {
            font-size: 0.75rem;
            color: #888;
            margin-top: 10px;
        }

        .list-items {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .list-items li {
            padding: 8px;
            background: #1a0826;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .list-items li:hover {
            border-color: #ff007f;
        }

        .list-items li.active {
            border-color: #00ffcc;
            box-shadow: 0 0 5px #00ffcc;
        }

        .user-avatar-img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid #ff007f;
            object-fit: cover;
            background: #000;
        }

        .msg-avatar-img {
            width: 22px;
            height: 22px;
            border-radius: 3px;
            border: 1px solid #00ffcc;
            object-fit: cover;
            vertical-align: middle;
            margin-right: 6px;
        }

        .message {
            background: #1a0826;
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid #ff007f;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.private-msg {
            background: #2b083a;
            border-left: 3px solid #b800ff;
            box-shadow: 0 0 8px rgba(184, 0, 255, 0.4);
        }

        .message .author {
            color: #00ffcc;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .message .time {
            color: #888;
            font-size: 0.75rem;
            font-weight: normal;
            margin-left: 10px;
        }

        .input-area {
            padding: 15px;
            background: #0d0211;
            border-top: 2px solid #00ffcc;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            background: #14051f;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 4px;
            outline: none;
        }

        .input-area button {
            padding: 0 25px;
            background: #00ffcc;
            color: #0d0211;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .emoji-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .emoji-btn {
            background: #1a0826;
            border: 1px solid #ff007f;
            color: #fff;
            border-radius: 4px;
            padding: 3px 7px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .emoji-btn:hover {
            background: #ff007f;
            box-shadow: 0 0 5px #ff007f;
        }

        .admin-badge {
            background: #ff0000;
            color: #ffffff;
            font-size: 0.65rem;
            padding: 2px 5px;
            border-radius: 3px;
            margin-left: 5px;
            font-weight: bold;
            box-shadow: 0 0 6px #ff0000;
        }

        /* --- MODÁLNE OKNÁ --- */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 998;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .profile-card-modal {
            background: #1a0826;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc;
            border-radius: 8px;
            padding: 20px;
            width: 320px;
            color: #00ffcc;
            text-align: center;
        }

        .profile-card-avatar {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            border: 2px solid #ff007f;
            object-fit: cover;
            margin-bottom: 10px;
        }

        /* --- RP POP-UP OKNO (RÝCHLA POŠTA) --- */
        .rp-box {
            background: #1a0826;
            border: 2px solid #b800ff;
            box-shadow: 0 0 25px #b800ff;
            border-radius: 8px;
            width: 420px;
            height: 520px;
            display: flex;
            flex-direction: column;
            color: #fff;
            overflow: hidden;
        }

        .rp-header {
            background: #0d0211;
            padding: 12px 15px;
            border-bottom: 2px solid #b800ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e066ff;
            font-weight: bold;
            font-size: 1.05rem;
        }

        .rp-close-btn {
            background: transparent;
            border: none;
            color: #ff007f;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
        }

        .rp-close-btn:hover {
            color: #ff0055;
        }

        .rp-messages-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #14051f;
        }

        .rp-msg {
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 85%;
            font-size: 0.9rem;
            word-wrap: break-word;
        }

        .rp-msg.my-rp {
            background: #3c0952;
            border: 1px solid #b800ff;
            align-self: flex-end;
            color: #00ffcc;
        }

        .rp-msg.their-rp {
            background: #230833;
            border: 1px solid #ff007f;
            align-self: flex-start;
            color: #fff;
        }

        .rp-input-area {
            padding: 12px;
            background: #0d0211;
            border-top: 2px solid #b800ff;
            display: flex;
            gap: 8px;
        }

        .rp-input-area input {
            flex: 1;
            padding: 10px;
            background: #14051f;
            border: 1px solid #b800ff;
            color: #00ffcc;
            border-radius: 4px;
            outline: none;
        }

        .rp-input-area button {
            padding: 0 18px;
            background: #b800ff;
            color: #fff;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 8px #b800ff;
        }

        .rp-input-area button:hover {
            background: #9900d6;
        }

        /* --- POKEC HOVER MINIKARTA --- */
        #pokec-hover-card {
            position: fixed;
            z-index: 10000;
            display: none;
            width: 250px;
            background: #fff;
            color: #222;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            overflow: hidden;
            font-family: Arial, sans-serif;
            border: 1px solid #ccc;
            pointer-events: auto;
        }

        .pokec-card-header {
            background: #0088ff;
            height: 35px;
            width: 100%;
        }

        .pokec-card-body {
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            background: #fff;
        }

        .pokec-card-avatar {
            width: 60px;
            height: 60px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        .pokec-card-info {
            display: flex;
            flex-direction: column;
        }

        .pokec-card-name {
            font-weight: bold;
            font-size: 0.95rem;
            color: #111;
        }

        .pokec-card-sub {
            font-size: 0.8rem;
            color: #666;
            margin-top: 2px;
        }

        .pokec-card-footer {
            border-top: 1px solid #eee;
            padding: 6px;
            display: flex;
            justify-content: space-around;
            background: #f9f9f9;
        }

        .pokec-card-btn {
            background: #0088ff;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }

        .pokec-card-btn:hover {
            background: #0066cc;
        }
    </style>
</head>
<body>

    <div id="auth-interface">
        <div class="logo-globtel">Globtel Chat ⚡</div>
        
        <div id="login-card" class="auth-container">
            <h2>Prihlásenie</h2>
            <div class="form-group">
                <label>Používateľské meno</label>
                <input type="text" id="login-username" placeholder="Zadaj meno">
            </div>
            <div class="form-group">
                <label>Heslo</label>
                <input type="password" id="login-password" placeholder="Zadaj heslo">
            </div>
            <button class="btn" onclick="spustitPrihlasenie()">Vstúpiť</button>
            <p>Nemáš účet? <a href="#" onclick="preopnutFormulare('register')">Zaregistruj sa</a></p>
        </div>

        <div id="register-card" class="auth-container" style="display: none;">
            <h2>Registrácia</h2>
            <div class="form-group">
                <label>Používateľské meno</label>
                <input type="text" id="register-username" placeholder="Min. 3 znaky">
            </div>
            <div class="form-group">
                <label>Heslo</label>
                <input type="password" id="register-password" placeholder="Vytvor si heslo">
            </div>
            <div class="form-group">
                <label>Pohlavie</label>
                <select id="register-gender">
                    <option value="male">Muž ♂</option>
                    <option value="female">Žena ♀</option>
                </select>
            </div>
            <button class="btn" onclick="spustitRegistraciu()">Vytvoriť účet</button>
            <p>Už máš účet? <a href="#" onclick="preopnutFormulare('login')">Prihlás sa</a></p>
        </div>
    </div>

    <!-- CHATOVACIE ROZHRANIE - POKEC LAYOUT (3 STĹPCE) -->
    <div id="chat-interface">
        <div class="chat-layout">
            
            <!-- 1. ĽAVÝ STĹPEC: Miestnosti -->
            <div class="sidebar-left">
                <h3>Miestnosti</h3>
                <ul class="list-items">
                    <li class="active">🌐 Globálny Chat</li>
                </ul>

                <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="nahratFotku(event)">
                <button class="btn btn-avatar" onclick="document.getElementById('avatarFileInput').click()">📷 Zmeniť fotku</button>
                <button class="btn btn-avatar" onclick="otvoritEditorProfilu()">✏️ Upraviť profil</button>

                <button class="btn btn-logout" onclick="odhlasitSa()">Odhlásiť sa</button>
            </div>
            
            <!-- 2. STREDNÝ STĹPEC: Hlavný chat -->
            <div class="main-chat">
                <div class="chat-header">
                    <span>Kanál: Globálny Chat</span>
                </div>
                <div id="spravy-box" class="messages-container"></div>
                <div class="input-area">
                    <div class="emoji-bar">
                        <button class="emoji-btn" onclick="pridajSmajlika('😊')">😊</button>
                        <button class="emoji-btn" onclick="pridajSmajlika('😂')">😂</button>
                        <button class="emoji-btn" onclick="pridajSmajlika('😎')">😎</button>
                        <button class="emoji-btn" onclick="pridajSmajlika('🔥')">🔥</button>
                        <button class="emoji-btn" onclick="pridajSmajlika('❤️')">❤️</button>
                        <button class="emoji-btn" onclick="pridajSmajlika('👍')">👍</button>
                        <button class="emoji-btn" onclick="pridajSmajlika('⚡')">⚡</button>
                        <button class="emoji-btn" onclick="pridajSmajlika('😜')">😜</button>
                    </div>
                    <div class="input-row">
                        <input type="text" id="sprava-input" placeholder="Napíš správu do globálu..." onkeypress="skontrolovatEnter(event)">
                        <button onclick="poslatSpravu()">Odoslať</button>
                    </div>
                </div>
            </div>

            <!-- 3. PRAVÝ STĹPEC: Ľudia v miestnosti + Reklamný box (Pokec štýl) -->
            <div class="sidebar-right">
                <div class="sidebar-right-top">
                    <h3>Ľudia v miestnosti</h3>
                    <ul id="pouzivatelia-list" class="list-items"></ul>
                </div>
                <div class="sidebar-right-banner">
                    <span style="font-size: 1.5rem;">⚡</span>
                    <strong style="font-size: 0.85rem; color: #ff007f; margin-top: 5px;">Globtel bez reklám</strong>
                    <p>Podporte prevádzku chatu a užite si ho naplno.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- RP POP-UP OKNO (RÝCHLA POŠTA) -->
    <div id="rp-popup-modal" class="modal-overlay" onclick="if(event.target === this) zatvoritRPOkno()">
        <div class="rp-box">
            <div class="rp-header">
                <span id="rp-title">📩 Rýchla Pošta (RP)</span>
                <button class="rp-close-btn" onclick="zatvoritRPOkno()">✖</button>
            </div>
            <div id="rp-messages-box" class="rp-messages-box"></div>
            <div class="rp-input-area">
                <input type="text" id="rp-input" placeholder="Napíš RP..." onkeypress="skontrolovatRPEnter(event)">
                <button onclick="poslatRPSpravu()">Poslať</button>
            </div>
        </div>
    </div>

    <!-- Modal pre zvätšenie fotky -->
    <div id="image-modal" class="modal-overlay" onclick="zatvoritFotku()" style="z-index:999; cursor:pointer;">
        <img id="modal-img" style="max-width:80%; max-height:80%; border:2px solid #00ffcc; box-shadow:0 0 20px #00ffcc; border-radius:8px; object-fit:contain;">
    </div>

    <!-- Modal pre Profilovú Kartu -->
    <div id="profile-modal" class="modal-overlay" onclick="if(event.target === this) zatvoritProfil()">
        <div class="profile-card-modal">
            <img id="card-avatar" class="profile-card-avatar" src="" alt="Avatar">
            <h3 id="card-username" style="color:#ff007f; margin-bottom:10px;"></h3>
            <p id="card-gender" style="margin-bottom:5px;"></p>
            <p id="card-age" style="margin-bottom:5px;"></p>
            <p id="card-city" style="margin-bottom:5px;"></p>
            <p id="card-about" style="font-style:italic; border-top:1px dashed #00ffcc; padding-top:8px; margin-top:8px;"></p>
            
            <button class="btn" style="margin-top:15px;" id="card-pm-btn">Nápíš RP</button>
            
            <div id="card-admin-actions" style="display:none; margin-top:10px; gap:8px; justify-content:center;">
                <button class="btn-kick" id="card-kick-btn">KICK</button>
                <button class="btn-ban" id="card-ban-btn">BAN</button>
            </div>

            <button class="btn btn-avatar" style="margin-top:5px;" onclick="zatvoritProfil()">Zatvoriť</button>
        </div>
    </div>

    <!-- Modal pre Úpravu profilu -->
    <div id="edit-profile-modal" class="modal-overlay" onclick="if(event.target === this) zatvoritEditorProfilu()">
        <div class="profile-card-modal">
            <h3 style="color:#ff007f; margin-bottom:15px;">Úprava profilu</h3>
            
            <div class="form-group">
                <label>Vek:</label>
                <input type="number" id="edit-age" placeholder="Napr. 25">
            </div>
            <div class="form-group" style="margin-top:10px;">
                <label>Mesto:</label>
                <input type="text" id="edit-city" placeholder="Napr. Bratislava">
            </div>
            <div class="form-group" style="margin-top:10px;">
                <label>O mne:</label>
                <input type="text" id="edit-about" placeholder="Napr. Rád četujem...">
            </div>

            <button class="btn" style="margin-top:15px;" onclick="ulozitProfil()">Uložiť</button>
            <button class="btn btn-avatar" style="margin-top:5px;" onclick="zatvoritEditorProfilu()">Zrušiť</button>
        </div>
    </div>

    <!-- POKEC MINIKARTA -->
    <div id="pokec-hover-card" onmouseenter="pomenutKarta(true)" onmouseleave="pomenutKarta(false)">
        <div class="pokec-card-header"></div>
        <div class="pokec-card-body">
            <img id="hover-avatar" class="pokec-card-avatar" src="" alt="Avatar">
            <div class="pokec-card-info">
                <span id="hover-username" class="pokec-card-name"></span>
                <span id="hover-details" class="pokec-card-sub"></span>
            </div>
        </div>
        <div class="pokec-card-footer">
            <button class="pokec-card-btn" id="hover-pm-btn">Nápíš RP</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let mojeMeno = "";
        let mojeRola = "user";
        let aktivnyRPUser = null; 
        const rpHistories = {}; 

        let hoverTimeout = null;
        let isHoveringCard = false;
        let mouseX = 0;
        let mouseY = 0;

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /* --- RP POP-UP OKNO LOGIKA --- */
        function otvoritRPOkno(targetUser) {
            if (!targetUser || targetUser === mojeMeno) return;
            
            aktivnyRPUser = targetUser;
            document.getElementById('rp-title').innerText = `📩 Rýchla Pošta: ${targetUser}`;
            document.getElementById('rp-popup-modal').style.display = 'flex';
            
            prikreslitRPHistoriu();
            document.getElementById('rp-input').focus();
        }

        function zatvoritRPOkno() {
            document.getElementById('rp-popup-modal').style.display = 'none';
            aktivnyRPUser = null;
        }

        function prikreslitRPHistoriu() {
            const box = document.getElementById('rp-messages-box');
            box.innerHTML = '';
            
            if (!aktivnyRPUser || !rpHistories[aktivnyRPUser]) return;

            rpHistories[aktivnyRPUser].forEach(msg => {
                const msgEl = document.createElement('div');
                msgEl.classList.add('rp-msg');
                if (msg.user === mojeMeno) {
                    msgEl.classList.add('my-rp');
                } else {
                    msgEl.classList.add('their-rp');
                }
                msgEl.innerText = msg.text;
                box.appendChild(msgEl);
            });

            box.scrollTop = box.scrollHeight;
        }

        function poslatRPSpravu() {
            const input = document.getElementById('rp-input');
            const text = input.value.trim();
            if (text !== "" && aktivnyRPUser) {
                const msgObj = {
                    user: mojeMeno,
                    target: aktivnyRPUser,
                    text: text,
                    isPrivate: true
                };

                socket.emit('chat message', {
                    text: text,
                    recipient: aktivnyRPUser
                });

                if (!rpHistories[aktivnyRPUser]) rpHistories[aktivnyRPUser] = [];
                rpHistories[aktivnyRPUser].push(msgObj);

                prikreslitRPHistoriu();
                input.value = "";
            }
        }

        function skontrolovatRPEnter(e) {
            if (e.key === 'Enter') poslatRPSpravu();
        }

        /* --- OSTATNÉ MODÁLNE OKNÁ A CHAT --- */
        function pridajSmajlika(emoji) {
            const input = document.getElementById('sprava-input');
            input.value += emoji;
            input.focus();
        }

        function zvacsitFotku(url) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = url;
            modal.style.display = 'flex';
        }

        function zatvoritFotku() {
            document.getElementById('image-modal').style.display = 'none';
        }

        function otvoritProfil(username) {
            socket.emit('get profile', username);
        }

        function zatvoritProfil() {
            document.getElementById('profile-modal').style.display = 'none';
        }

        function otvoritEditorProfilu() {
            document.getElementById('edit-profile-modal').style.display = 'flex';
        }

        function zatvoritEditorProfilu() {
            document.getElementById('edit-profile-modal').style.display = 'none';
        }

        async function ulozitProfil() {
            const age = document.getElementById('edit-age').value;
            const city = document.getElementById('edit-city').value;
            const about = document.getElementById('edit-about').value;

            try {
                const res = await fetch('/api/profile/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: mojeMeno, age, city, about })
                });

                const data = await res.json();
                if (data.success) {
                    alert("Profil bol úspešne aktualizovaný!");
                    zatvoritEditorProfilu();
                } else {
                    alert("Chyba pri ukladaní profilu.");
                }
            } catch (e) {
                alert("Server je nedostupný.");
            }
        }

        socket.on('view profile card', (data) => {
            const adminTag = data.role === 'admin' ? ' <span class="admin-badge">[ADMIN]</span>' : '';
            document.getElementById('card-username').innerHTML = escapeHtml(data.username) + adminTag;
            document.getElementById('card-avatar').src = data.profile?.avatar || 'https://via.placeholder.com/80/000000/00ffcc?text=User';
            document.getElementById('card-gender').innerText = 'Pohlavie: ' + (data.profile?.gender === 'female' ? 'Žena ♀' : 'Muž ♂');
            document.getElementById('card-age').innerText = 'Vek: ' + (data.profile?.age || 'Nezadaný');
            document.getElementById('card-city').innerText = 'Mesto: ' + (data.profile?.city ? escapeHtml(data.profile.city) : 'Nezadané');
            document.getElementById('card-about').innerText = 'O mne: ' + (data.profile?.about ? escapeHtml(data.profile.about) : 'Ahoj!');

            const pmBtn = document.getElementById('card-pm-btn');
            const adminActions = document.getElementById('card-admin-actions');

            if (data.username === mojeMeno) {
                pmBtn.style.display = 'none';
                adminActions.style.display = 'none';
            } else {
                pmBtn.style.display = 'inline-block';
                pmBtn.onclick = () => {
                    zatvoritProfil();
                    otvoritRPOkno(data.username);
                };

                if (mojeRola === 'admin') {
                    adminActions.style.display = 'flex';
                    document.getElementById('card-kick-btn').onclick = () => {
                        if (confirm(`Naozaj chceš vyhodiť používateľa ${data.username}?`)) {
                            socket.emit('admin kick user', data.username);
                            zatvoritProfil();
                        }
                    };
                    document.getElementById('card-ban-btn').onclick = () => {
                        if (confirm(`Naozaj chceš dať BAN používateľovi ${data.username}?`)) {
                            socket.emit('admin ban user', data.username);
                            zatvoritProfil();
                        }
                    };
                } else {
                    adminActions.style.display = 'none';
                }
            }

            document.getElementById('profile-modal').style.display = 'flex';
        });

        /* --- HOVER MINIKARTA LOGIKA --- */
        function ukaziKarta(e, username) {
            clearTimeout(hoverTimeout);
            mouseX = e.clientX + 12;
            mouseY = e.clientY + 12;
            socket.emit('get hover profile', username);
        }

        function skrytcKarta() {
            hoverTimeout = setTimeout(() => {
                if (!isHoveringCard) {
                    document.getElementById('pokec-hover-card').style.display = 'none';
                }
            }, 300);
        }

        function pomenutKarta(isHover) {
            isHoveringCard = isHover;
            if (!isHover) skrytcKarta();
        }

        socket.on('show hover profile', (data) => {
            const card = document.getElementById('pokec-hover-card');
            const adminBadge = data.role === 'admin' ? ' [ADMIN]' : '';
            document.getElementById('hover-username').innerText = data.username + adminBadge;
            
            const genderStr = data.profile?.gender === 'female' ? 'Žena' : 'Muž';
            const ageStr = data.profile?.age ? `, ${data.profile.age} r.` : '';
            const cityStr = data.profile?.city ? ` / ${escapeHtml(data.profile.city)}` : '';
            
            document.getElementById('hover-details').innerText = `${genderStr}${ageStr}${cityStr}`;
            document.getElementById('hover-avatar').src = data.profile?.avatar || 'https://via.placeholder.com/60/000000/00ffcc?text=User';

            const pmBtn = document.getElementById('hover-pm-btn');
            if (data.username === mojeMeno) {
                pmBtn.style.display = 'none';
            } else {
                pmBtn.style.display = 'inline-block';
                pmBtn.onclick = () => {
                    card.style.display = 'none';
                    otvoritRPOkno(data.username);
                };
            }

            card.style.left = `${mouseX}px`;
            card.style.top = `${mouseY}px`;
            card.style.display = 'block';
        });

        function preopnutFormulare(typ) {
            document.getElementById('login-card').style.display = typ === 'login' ? 'block' : 'none';
            document.getElementById('register-card').style.display = typ === 'register' ? 'block' : 'none';
        }

        async function spustitRegistraciu() {
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value.trim();
            const gender = document.getElementById('register-gender').value;

            if (!username || !password) {
                alert("Vyplň meno aj heslo!");
                return;
            }

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, gender })
            });
            const data = await res.json();
            
            if (data.success) {
                alert("Registrácia úspešná! Môžeš sa prihlásiť.");
                preopnutFormulare('login');
            } else {
                alert(data.message || "Chyba pri registrácii");
            }
        }

        async function spustitPrihlasenie() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!username || !password) {
                alert("Vyplň meno aj heslo!");
                return;
            }

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                mojeMeno = data.username;
                mojeRola = data.role || 'user';

                document.getElementById('auth-interface').style.display = 'none';
                document.getElementById('chat-interface').style.display = 'block';
                
                socket.emit('user logged in', mojeMeno);
            } else {
                alert(data.message || "Nesprávne prihlasovacie údaje");
            }
        }

        async function nahratFotku(event) {
            const file = event.target.files[0];
            if (!file) return;

            const CLOUD_NAME = "juyie103"; 
            const UPLOAD_PRESET = "globtel_preset";

            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();
                if (data.secure_url) {
                    socket.emit('change avatar', data.secure_url);
                } else if (data.error) {
                    alert("Chyba z Cloudinary: " + data.error.message);
                }
            } catch (err) {
                alert("Chyba pri nahrávaní obrázka!");
            }
        }

        function poslatSpravu() {
            const input = document.getElementById('sprava-input');
            const text = input.value.trim();
            if (text !== "") {
                socket.emit('chat message', {
                    text: text,
                    recipient: "global"
                });
                input.value = "";
            }
        }

        function skontrolovatEnter(e) {
            if (e.key === 'Enter') poslatSpravu();
        }

        function odhlasitSa() {
            location.reload(); 
        }

        function vykreslitSpravu(msg) {
            if (msg.isPrivate) {
                const partner = (msg.user === mojeMeno) ? msg.target : msg.user;
                if (!rpHistories[partner]) rpHistories[partner] = [];
                
                const vyhovuje = rpHistories[partner].some(m => m.text === msg.text && m.user === msg.user);
                if (!vyhovuje) {
                    rpHistories[partner].push(msg);
                }

                if (aktivnyRPUser === partner) {
                    prikreslitRPHistoriu();
                } else if (msg.user !== mojeMeno) {
                    otvoritRPOkno(partner);
                }
                return;
            }

            const box = document.getElementById('spravy-box');
            const msgEl = document.createElement('div');
            msgEl.classList.add('message');
            
            const safeUser = escapeHtml(msg.user);
            const safeText = escapeHtml(msg.text);
            const casHtml = msg.time ? `<span class="time">${escapeHtml(msg.time)}</span>` : '';
            const avatarHtml = msg.avatar ? `<img src="${escapeHtml(msg.avatar)}" class="msg-avatar-img" style="cursor:pointer;" onmouseenter="ukaziKarta(event, '${safeUser}')" onmouseleave="skrytcKarta()" onclick="event.stopPropagation(); zvacsitFotku('${escapeHtml(msg.avatar)}')">` : '';
            const adminTag = msg.role === 'admin' ? '<span class="admin-badge">[ADMIN]</span>' : '';

            let autorText = `<span style="cursor:pointer;" onmouseenter="ukaziKarta(event, '${safeUser}')" onmouseleave="skrytcKarta()">${safeUser}</span>${adminTag}`;

            msgEl.innerHTML = `<div class="author"><span>${avatarHtml}${autorText}</span>${casHtml}</div><div>${safeText}</div>`;
            
            box.appendChild(msgEl);
            box.scrollTop = box.scrollHeight;
        }

        socket.on('chat history', (historia) => {
            const box = document.getElementById('spravy-box');
            box.innerHTML = ''; 
            historia.forEach(msg => vykreslitSpravu(msg));
        });

        socket.on('chat message', (msg) => {
            vykreslitSpravu(msg);
        });

        socket.on('update userlist', (list) => {
            const uList = document.getElementById('pouzivatelia-list');
            uList.innerHTML = "";
            list.forEach(u => {
                const li = document.createElement('li');
                const ikona = u.gender === 'female' ? '♀️' : '♂️';
                const adminTag = u.role === 'admin' ? '<span class="admin-badge">[ADMIN]</span>' : '';
                const safeName = escapeHtml(u.username);
                
                let avatarElement = '';
                if (u.avatar) {
                    avatarElement = `<img src="${escapeHtml(u.avatar)}" class="user-avatar-img" style="cursor:pointer;" onmouseenter="ukaziKarta(event, '${safeName}')" onmouseleave="skrytcKarta()" onclick="event.stopPropagation(); zvacsitFotku('${escapeHtml(u.avatar)}')">`;
                }

                li.innerHTML = `${avatarElement} <span style="cursor:pointer;" onmouseenter="ukaziKarta(event, '${safeName}')" onmouseleave="skrytcKarta()" onclick="event.stopPropagation(); otvoritProfil('${safeName}')">${ikona} ${safeName}${adminTag}</span>`;
                
                li.onclick = () => otvoritRPOkno(u.username);
                uList.appendChild(li);
            });
        });

        socket.on('kicked out', () => {
            alert('Bol si vyhodený z chatu adminom!');
            location.reload();
        });

        socket.on('banned out', () => {
            alert('Tvoj účet bol zablokovaný (BAN)!');
            location.reload();
        });
    </script>
</body>
</html>
