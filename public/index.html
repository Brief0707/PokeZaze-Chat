<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globtel Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #0d0211;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- PRIHLASOVACIA OBRAZOVKA --- */
        .auth-container {
            background: #1a0826;
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, inset 0 0 10px #1a0826;
            padding: 30px;
            border-radius: 8px;
            width: 350px;
            text-align: center;
        }

        .auth-container h2 {
            color: #ff007f;
            text-shadow: 0 0 8px #ff007f;
            margin-bottom: 20px;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        .logo-globtel {
            color: #00ffcc;
            text-shadow: 0 0 8px #00ffcc;
            font-size: 2.2rem;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #00ffcc;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #0d0211;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 4px;
            outline: none;
        }

        .form-group input:focus {
            box-shadow: 0 0 8px #00ffcc;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #ff007f;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px #ff007f;
            margin-top: 10px;
        }

        .btn:hover {
            background: #e0006c;
            box-shadow: 0 0 15px #e0006c;
        }

        .btn-avatar {
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
            margin-top: 5px;
        }

        .btn-avatar:hover {
            background: #00ffcc;
            color: #0d0211;
            box-shadow: 0 0 12px #00ffcc;
        }

        .btn-logout {
            background: #ff0055;
            box-shadow: 0 0 10px #ff0055;
            margin-top: auto;
        }

        .btn-logout:hover {
            background: #cc0044;
            box-shadow: 0 0 15px #cc0044;
        }

        .auth-container p {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #888;
        }

        .auth-container a {
            color: #00ffcc;
            text-decoration: none;
        }

        .auth-container a:hover {
            text-decoration: underline;
        }

        /* --- CHATOVACIE ROZHRANIE --- */
        #chat-interface {
            display: none;
            width: 95vw;
            height: 90vh;
            background: #14051f;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc;
            border-radius: 8px;
        }

        .chat-layout {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: 250px;
            background: #0d0211;
            border-right: 2px solid #00ffcc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar h3 {
            color: #ff007f;
            text-shadow: 0 0 5px #ff007f;
            font-size: 1.1rem;
            border-bottom: 1px dashed #ff007f;
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        .list-items {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .list-items li {
            padding: 8px;
            background: #1a0826;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .list-items li:hover {
            border-color: #ff007f;
        }

        .list-items li.active {
            border-color: #00ffcc;
            box-shadow: 0 0 5px #00ffcc;
        }

        /* Fotky v zozname a správach */
        .user-avatar-img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid #ff007f;
            object-fit: cover;
            background: #000;
        }

        .msg-avatar-img {
            width: 22px;
            height: 22px;
            border-radius: 3px;
            border: 1px solid #00ffcc;
            object-fit: cover;
            vertical-align: middle;
            margin-right: 6px;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #14051f;
        }

        .chat-header {
            padding: 15px;
            background: #0d0211;
            border-bottom: 2px solid #00ffcc;
            color: #ff007f;
            text-shadow: 0 0 5px #ff007f;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Štýl obyčajnej správy */
        .message {
            background: #1a0826;
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid #ff007f;
            max-width: 80%;
        }

        /* Štýl pre súkromnú správu (PM) */
        .message.private-msg {
            background: #2b083a;
            border-left: 3px solid #b800ff;
            box-shadow: 0 0 8px rgba(184, 0, 255, 0.4);
        }

        .message .author {
            color: #00ffcc;
            font-weight: bold;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .message.private-msg .author {
            color: #e066ff;
        }

        .message .time {
            color: #666;
            font-size: 0.75rem;
            font-weight: normal;
        }

        .input-area {
            padding: 15px;
            background: #0d0211;
            border-top: 2px solid #00ffcc;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            background: #14051f;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 4px;
            outline: none;
        }

        .input-area button {
            padding: 0 25px;
            background: #00ffcc;
            color: #0d0211;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .pm-badge {
            background: #b800ff;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div id="auth-interface">
        <div class="logo-globtel" style="text-align: center;">Globtel Chat ⚡</div>
        
        <div id="login-card" class="auth-container">
            <h2>Prihlásenie</h2>
            <div class="form-group">
                <label>Používateľské meno</label>
                <input type="text" id="login-username" placeholder="Zadaj meno">
            </div>
            <div class="form-group">
                <label>Heslo</label>
                <input type="password" id="login-password" placeholder="Zadaj heslo">
            </div>
            <button class="btn" onclick="spustitPrihlasenie()">Vstúpiť</button>
            <p>Nemáš účet? <a href="#" onclick="preopnutFormulare('register')">Zaregistruj sa</a></p>
        </div>

        <div id="register-card" class="auth-container" style="display: none;">
            <h2>Registrácia</h2>
            <div class="form-group">
                <label>Používateľské meno</label>
                <input type="text" id="register-username" placeholder="Min. 3 znaky">
            </div>
            <div class="form-group">
                <label>Heslo</label>
                <input type="password" id="register-password" placeholder="Vytvor si heslo">
            </div>
            <div class="form-group">
                <label>Pohlavie</label>
                <select id="register-gender">
                    <option value="male">Muž ♂</option>
                    <option value="female">Žena ♀</option>
                </select>
            </div>
            <button class="btn" onclick="spustitRegistraciu()">Vytvoriť účet</button>
            <p>Už máš účet? <a href="#" onclick="preopnutFormulare('login')">Prihlás sa</a></p>
        </div>
    </div>

    <div id="chat-interface">
        <div class="chat-layout">
            <div class="sidebar">
                <h3>Miestnosti</h3>
                <ul class="list-items">
                    <li class="active" onclick="zrusitPM()">🌐 Globálny Chat</li>
                </ul>
                
                <h3>Online Ľudia</h3>
                <ul id="pouzivatelia-list" class="list-items">
                </ul>

                <!-- Tlačidlo pre výber fotky z PC -->
                <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="nahratFotku(event)">
                <button class="btn btn-avatar" onclick="document.getElementById('avatarFileInput').click()">📷 Zmeniť fotku</button>

                <button class="btn btn-logout" onclick="odhlasitSa()">Odhlásiť sa</button>
            </div>
            
            <div class="main-chat">
                <div class="chat-header">
                    <span id="kanal-nazov">Kanál: Globálny Chat</span>
                    <span id="pm-info" style="font-size: 0.85rem; color: #b800ff; display: none;">🔒 Súkromný rozhovor</span>
                </div>
                <div id="spravy-box" class="messages-container"></div>
                <div class="input-area">
                    <input type="text" id="sprava-input" placeholder="Napíš správu..." onkeypress="skontrolovatEnter(event)">
                    <button onclick="poslatSpravu()">Odoslať</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let mojeMeno = "";
        let vybranyPrijemca = "global"; // Defaultne posielame do globálu

        function preopnutFormulare(typ) {
            document.getElementById('login-card').style.display = typ === 'login' ? 'block' : 'none';
            document.getElementById('register-card').style.display = typ === 'register' ? 'block' : 'none';
        }

        async function spustitRegistraciu() {
            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;
            const gender = document.getElementById('register-gender').value;

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, gender })
            });
            const data = await res.json();
            
            if (data.success) {
                alert("Registrácia úspešná! Môžeš sa prihlásiť.");
                preopnutFormulare('login');
            } else {
                alert(data.message || "Chyba pri registrácii");
            }
        }

        async function spustitPrihlasenie() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                mojeMeno = data.username;
                document.getElementById('auth-interface').style.display = 'none';
                document.getElementById('chat-interface').style.display = 'block';
                
                socket.emit('user logged in', mojeMeno);
            } else {
                alert(data.message || "Nesprávne prihlasovacie údaje");
            }
        }

        /* --- NAHRÁVANIE FOTKY CEZ CLOUDINARY --- */
        async function nahratFotku(event) {
            const file = event.target.files[0];
            if (!file) return;

            // NASTAVENÉ ÚDAJE Z CLOUDINARY ÚČTU:
            const CLOUD_NAME = "juyie103"; 
            const UPLOAD_PRESET = "globtel_preset";

            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();
                if (data.secure_url) {
                    socket.emit('change avatar', data.secure_url);
                } else if (data.error) {
                    alert("Chyba z Cloudinary: " + data.error.message);
                }
            } catch (err) {
                alert("Chyba pri nahrávaní obrázka!");
                console.error(err);
            }
        }

        function nastavitPM(meno) {
            if (meno === mojeMeno) return; // Nemôžeš písať sám sebe
            vybranyPrijemca = meno;
            document.getElementById('kanal-nazov').innerText = `Súkromná správa pre: ${meno}`;
            document.getElementById('pm-info').style.display = 'inline';
            document.getElementById('sprava-input').placeholder = `Píšeš súkromne používateľovi ${meno}...`;
            document.getElementById('sprava-input').focus();
        }

        function zrusitPM() {
            vybranyPrijemca = "global";
            document.getElementById('kanal-nazov').innerText = `Kanál: Globálny Chat`;
            document.getElementById('pm-info').style.display = 'none';
            document.getElementById('sprava-input').placeholder = `Napíš správu a stlač Enter...`;
        }

        function poslatSpravu() {
            const input = document.getElementById('sprava-input');
            const text = input.value.trim();
            if (text !== "") {
                socket.emit('chat message', {
                    text: text,
                    recipient: vybranyPrijemca
                });
                input.value = "";
            }
        }

        function skontrolovatEnter(e) {
            if (e.key === 'Enter') poslatSpravu();
        }

        function odhlasitSa() {
            location.reload(); 
        }

        function vykreslitSpravu(msg) {
            const box = document.getElementById('spravy-box');
            const msgEl = document.createElement('div');
            msgEl.classList.add('message');

            if (msg.isPrivate) {
                msgEl.classList.add('private-msg');
            }
            
            const casHtml = msg.time ? `<span class="time">${msg.time}</span>` : '';
            const avatarHtml = msg.avatar ? `<img src="${msg.avatar}" class="msg-avatar-img">` : '';
            
            let autorText = msg.user;
            if (msg.isPrivate) {
                if (msg.user === mojeMeno) {
                    autorText = `Pre ${msg.target} <span class="pm-badge">🔒 SÚKROMNE</span>`;
                } else {
                    autorText = `Od ${msg.user} <span class="pm-badge">🔒 SÚKROMNE</span>`;
                }
            }

            msgEl.innerHTML = `<div class="author"><span>${avatarHtml}${autorText}</span>${casHtml}</div><div>${msg.text}</div>`;
            
            box.appendChild(msgEl);
            box.scrollTop = box.scrollHeight;
        }

        socket.on('chat history', (historia) => {
            const box = document.getElementById('spravy-box');
            box.innerHTML = ''; 
            historia.forEach(msg => {
                vykreslitSpravu(msg);
            });
        });

        socket.on('chat message', (msg) => {
            vykreslitSpravu(msg);
        });

        socket.on('update userlist', (list) => {
            const uList = document.getElementById('pouzivatelia-list');
            uList.innerHTML = "";
            list.forEach(u => {
                const li = document.createElement('li');
                const ikona = u.gender === 'female' ? '♀️' : '♂️';
                
                let avatarElement = '';
                if (u.avatar) {
                    avatarElement = `<img src="${u.avatar}" class="user-avatar-img">`;
                }

                li.innerHTML = `${avatarElement} <span>${ikona} ${u.username}</span>`;
                
                // Po kliknutí na používateľa nastavíme Súkromnú správu
                li.onclick = () => nastavitPM(u.username);
                
                uList.appendChild(li);
            });
        });
    </script>
</body>
</html>
